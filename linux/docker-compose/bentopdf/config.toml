[services]
[services.bento-pdf]
image = "ghcr.io/alam00000/bentopdf:sha-45496fc"
security_opt = [ "no-new-privileges:true" ]
container_name = "bento-pdf"
hostname = "bento-pdf"
# ports = ["8080:8080"]
networks = [
  "swag"
]
restart = "unless-stopped"
[[services.bento-pdf.volumes]]
type = "bind"
source = "/etc/localtime"
target = "/etc/localtime" 
read_only = true

[networks.swag]
external = true
