services:
  ollama:
    image: ollama/ollama:latest
    security_opt:
      - no-new-privileges:true
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    networks:
      - swag
    ports:
      - 11434:11434
    environment:
      TZ: America/Panama
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - type: volume
        source: models
        target: /root/.ollama
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    hostname: open-webui
    restart: unless-stopped
    networks:
      - swag
    ports:
      - 3000:8080
    environment:
      TZ: America/Panama
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ""
      WEBUI_NAME: Olympia
    volumes:
      - type: volume
        source: open-webui-data
        target: /app/backend/data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
volumes:
  models: {}
  open-webui-data: {}
networks:
  swag:
    external: true
