[services.ollama]
image = "ollama/ollama:latest"
security_opt = [ "no-new-privileges:true" ]
container_name = "ollama"
hostname = "ollama"
restart = "unless-stopped"
networks = [
  "swag"
]
ports = [
  "11434:11434"
]
[services.ollama.environment]
TZ = "America/Panama"
OLLAMA_KEEP_ALIVE = "10m"
OLLAMA_NUM_PARALLEL = 1
[[services.ollama.volumes]]
type = "volume"
source = "models"
target = "/root/.ollama"
[[services.ollama.volumes]]
type = "bind"
source = "/etc/localtime"
target = "/etc/localtime"
read_only = true

[services.open-webui]
image = "ghcr.io/open-webui/open-webui:main"
container_name = "open-webui"
hostname = "open-webui"
restart = "unless-stopped"
networks = [
  "swag"
]
ports = [
  "3000:8080"
]
[services.open-webui.environment]
TZ = "America/Panama"
OLLAMA_BASE_URL = "http://ollama:11434"
WEBUI_SECRET_KEY = ""
WEBUI_NAME = "Olympia"
[[services.open-webui.volumes]]
type = "volume"
source = "open-webui-data"
target = "/app/backend/data"
[[services.open-webui.volumes]]
type = "bind"
source = "/etc/localtime"
target = "/etc/localtime"
read_only = true

[volumes.models]

[volumes.open-webui-data]

[networks.swag]
external = true
